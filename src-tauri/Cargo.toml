[package]
name = "picker"
version = "1.0.0"
description = "Random picker for when you can't decide"
authors = ["dev1f965x"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The mobile targets load the app as a library; the _lib suffix avoids a name clash with the binary on Windows.
name = "picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
